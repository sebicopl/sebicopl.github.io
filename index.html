<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>mObywatel - Generator Dowodu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(255,255,255,0.96);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5);
        }
        header {
            background: #0a2f44;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }
        header h1 { font-size: 1.9rem; }
        header p { opacity: 0.8; }
        .form-card, .dowod-card { padding: 24px 22px; }
        .input-group { margin-bottom: 18px; }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #1e2f3c;
            font-size: 0.85rem;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 28px;
            border: 1.5px solid #cfdfed;
            font-size: 1rem;
            background: white;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2c5a7a;
            box-shadow: 0 0 0 3px rgba(44,90,122,0.2);
        }
        .row-2col { display: flex; gap: 12px; }
        .row-2col > div { flex: 1; }
        button[type="submit"] {
            background: #0f6b3a;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #064e2b;
            transition: 0.05s linear;
        }
        button[type="submit"]:active { transform: translateY(2px); box-shadow: 0 2px 0 #064e2b; }
        
        /* DOWÓD */
        .dowod-card { display: none; background: white; border-radius: 32px; }
        .dowod-header {
            background: #0a2f44;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gov-badge {
            background: #ffc107;
            color: #1e2f3c;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .zdjecie-sekcja {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 28px;
            border-bottom: 1px solid #e0e7ef;
            padding-bottom: 20px;
        }
        .zdjecie-ramka {
            width: 110px;
            height: 130px;
            background: #eef2f7;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2f7;
            font-size: 40px;
        }
        .grid-dane {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 10px;
        }
        .pole-dane {
            background: #f8fafc;
            padding: 10px;
            border-radius: 16px;
        }
        .label-mini {
            font-weight: bold;
            color: #2c5a7a;
            font-size: 0.7rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }
        .wartosc {
            font-size: 1rem;
            font-weight: 600;
            color: #1e2f3c;
        }
        .back-btn {
            background: #eef2f7;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
        }
        .info-box {
            background: #eef3fc;
            padding: 14px;
            border-radius: 24px;
            margin: 20px 0 10px;
            font-size: 0.75rem;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            background: #eaf0f5;
            color: #2c4d6e;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>cwelObywatel 2.0</h1>
        <p>Michał nie ma palca</p>
    </header>

    <!-- FORMULARZ -->
    <div id="formularzSection" class="form-card">
        <form id="mainForm">
            <div class="input-group">
                <label for="name">Imię *</label>
                <input type="text" id="name" name="name" autocomplete="given-name" required>
            </div>
            <div class="input-group">
                <label for="surname">Nazwisko *</label>
                <input type="text" id="surname" name="surname" autocomplete="family-name" required>
            </div>
            <div class="input-group">
                <label for="gender">Płeć</label>
                <select id="gender" name="gender" autocomplete="sex">
                    <option>Mężczyzna</option>
                    <option>Kobieta</option>
                </select>
            </div>
            <div class="input-group">
                <label for="dob">Data urodzenia *</label>
                <input type="date" id="dob" name="dob" autocomplete="bday" required>
            </div>
            <div class="input-group">
                <label for="birthPlace">Miejsce urodzenia *</label>
                <input type="text" id="birthPlace" name="birthPlace" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label for="street">Ulica i numer *</label>
                <input type="text" id="street" name="street" autocomplete="street-address" required>
            </div>
            <div class="row-2col">
                <div class="input-group">
                    <label for="postalCode">Kod pocztowy *</label>
                    <input type="text" id="postalCode" name="postalCode" autocomplete="postal-code" required>
                </div>
                <div class="input-group">
                    <label for="city">Miasto *</label>
                    <input type="text" id="city" name="city" autocomplete="address-level2" required>
                </div>
            </div>
            <button type="submit">✅ WEJDŹ - POKAŻ DOWÓD</button>
        </form>
        <div class="info-box">📱 Dodaj do ekranu głównego – działa jak aplikacja</div>
    </div>

    <!-- EKRAN DOWODU -->
    <div id="dowodSection" class="dowod-card">
        <div class="dowod-header">
            <h3>📘 mObywatel</h3>
            <div class="gov-badge">RZECZPOSPOLITA POLSKA</div>
        </div>
        <div style="padding:24px">
            <div class="zdjecie-sekcja">
                <div class="zdjecie-ramka" id="dowodFoto">📷</div>
                <div>
                    <div class="label-mini">IMIĘ I NAZWISKO</div>
                    <div class="wartosc" id="dowodImieNazwisko">-</div>
                    <div class="label-mini" style="margin-top:12px;">PESEL</div>
                    <div class="wartosc" id="dowodPesel">-</div>
                </div>
            </div>
            <div class="grid-dane">
                <div class="pole-dane">
                    <div class="label-mini">DATA URODZENIA</div>
                    <div class="wartosc" id="dowodDataUr">-</div>
                </div>
                <div class="pole-dane">
                    <div class="label-mini">PŁEĆ</div>
                    <div class="wartosc" id="dowodPlec">-</div>
                </div>
                <div class="pole-dane">
                    <div class="label-mini">MIEJSCE URODZENIA</div>
                    <div class="wartosc" id="dowodMiejsceUr">-</div>
                </div>
                <div class="pole-dane">
                    <div class="label-mini">ADRES</div>
                    <div class="wartosc" id="dowodAdres">-</div>
                </div>
                <div class="pole-dane">
                    <div class="label-mini">TERMIN WAŻNOŚCI</div>
                    <div class="wartosc" id="dowodWaznosc">-</div>
                </div>
            </div>
            <button class="back-btn" id="backBtn">✏️ EDYTUJ DANE</button>
        </div>
    </div>
    <footer>Generator dowodu osobistego - pełen PESEL</footer>
</div>

<script>
    // Funkcja generująca PESEL na podstawie daty urodzenia i płci
    function generatePesel(dob, gender) {
        if (!dob) return "12345678901";
        const [year, month, day] = dob.split('-');
        let yy = year.slice(-2);
        let mm = parseInt(month);
        // Dla lat 2000+ dodajemy 20 do miesiąca
        if (parseInt(year) >= 2000) mm += 20;
        const peselDate = yy + mm.toString().padStart(2, '0') + day;
        const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
        const genderDigit = (gender === "Mężczyzna") ? "1" : "2";
        const peselBase = peselDate + random + genderDigit;
        
        // Obliczanie cyfry kontrolnej
        let sum = 0;
        const weights = [1, 3, 7, 9, 1, 3, 7, 9, 1, 3];
        for (let i = 0; i < 10; i++) {
            sum += parseInt(peselBase[i]) * weights[i];
        }
        const control = (10 - (sum % 10)) % 10;
        return peselBase + control;
    }

    function getExpiry() {
        const d = new Date();
        d.setFullYear(d.getFullYear() + 5);
        return d.toLocaleDateString('pl-PL');
    }

    // Przejście do dowodu
    const formDiv = document.getElementById('formularzSection');
    const dowodDiv = document.getElementById('dowodSection');
    const form = document.getElementById('mainForm');

    form.onsubmit = function(event) {
        event.preventDefault();
        
        // Pobierz dane
        const name = document.getElementById('name').value.trim();
        const surname = document.getElementById('surname').value.trim();
        const gender = document.getElementById('gender').value;
        const dob = document.getElementById('dob').value;
        const birthPlace = document.getElementById('birthPlace').value.trim();
        const street = document.getElementById('street').value.trim();
        const postal = document.getElementById('postalCode').value.trim();
        const city = document.getElementById('city').value.trim();
        
        // Sprawdź czy wszystkie pola są wypełnione
        if (!name || !surname || !dob || !birthPlace || !street || !postal || !city) {
            alert("❌ Wypełnij wszystkie pola oznaczone *");
            return;
        }
        
        // Generuj PESEL i datę ważności
        const pesel = generatePesel(dob, gender);
        const expiry = getExpiry();
        
        // Wypełnij dane w dowodzie
        document.getElementById('dowodImieNazwisko').innerText = `${name} ${surname}`;
        document.getElementById('dowodPesel').innerText = pesel;
        document.getElementById('dowodDataUr').innerHTML = new Date(dob).toLocaleDateString('pl-PL');
        document.getElementById('dowodPlec').innerText = gender;
        document.getElementById('dowodMiejsceUr').innerText = birthPlace;
        document.getElementById('dowodAdres').innerText = `${street}, ${postal} ${city}`;
        document.getElementById('dowodWaznosc').innerText = expiry;
        
        // Ustaw domyślne zdjęcie (bo nie wymagamy dodawania)
        const fotoRamka = document.getElementById('dowodFoto');
        fotoRamka.innerHTML = '👤';
        fotoRamka.style.fontSize = '40px';
        fotoRamka.style.display = 'flex';
        fotoRamka.style.alignItems = 'center';
        fotoRamka.style.justifyContent = 'center';
        
        // PRZEŁĄCZ WIDOKI
        formDiv.style.display = 'none';
        dowodDiv.style.display = 'block';
    };

    // Przycisk powrotu
    document.getElementById('backBtn').onclick = function() {
        dowodDiv.style.display = 'none';
        formDiv.style.display = 'block';
    };
</script>
</body>
</html>
