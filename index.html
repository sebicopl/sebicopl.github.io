<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>mObywatel - generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(255,255,255,0.94);
            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        header {
            background: #0a2f44;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }
        header h1 { font-size: 1.9rem; letter-spacing: -0.5px; }
        header p { opacity: 0.8; font-size: 0.9rem; }
        .form-card { padding: 24px 22px; }
        .photo-zone {
            background: #f0f4f8;
            border-radius: 32px;
            padding: 20px;
            text-align: center;
            margin-bottom: 28px;
            border: 2px dashed #3a6b92;
            cursor: pointer;
        }
        .photo-preview {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 12px;
            background: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 3px solid white;
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        .photo-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #9aaebf; color: #2c3e4e;
        }
        .photo-btn {
            background: #2c5a7a; border: none; color: white;
            padding: 8px 18px; border-radius: 100px; font-weight: bold;
            margin-top: 8px; cursor: pointer; font-size: 0.9rem;
            display: inline-block;
        }
        .input-group { margin-bottom: 18px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; color: #1e2f3c; font-size: 0.85rem; }
        input, select {
            width: 100%; padding: 12px 15px; border-radius: 28px;
            border: 1.5px solid #cfdfed; font-size: 1rem; background: white;
        }
        input:focus, select:focus { outline: none; border-color: #2c5a7a; box-shadow: 0 0 0 3px rgba(44,90,122,0.2); }
        .row-2col { display: flex; gap: 12px; }
        .row-2col > div { flex: 1; }
        button[type="submit"] {
            background: #0f6b3a; color: white; border: none;
            padding: 15px; width: 100%; font-size: 1.3rem; font-weight: bold;
            border-radius: 50px; margin-top: 20px; cursor: pointer;
            box-shadow: 0 5px 0 #064e2b;
        }
        button[type="submit"]:active { transform: translateY(2px); box-shadow: 0 2px 0 #064e2b; }
        .info-box {
            background: #eef3fc; padding: 14px; border-radius: 24px;
            margin: 20px 0 10px; font-size: 0.75rem; color: #004070; text-align: center;
        }
        .loading-indicator { display: none; text-align: center; margin-top: 10px; font-weight: bold; color: #2c5a7a; }
        footer { text-align: center; padding: 12px; font-size: 0.7rem; background: #eaf0f5; color: #2c4d6e; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>cwelObywatel 2.0</h1><p>Michał nie ma palca</p></header>
    <div class="form-card">
        <div id="photoZone" class="photo-zone">
            <div class="photo-preview" id="photoPreview"><div class="photo-placeholder">📷</div></div>
            <div><button type="button" class="photo-btn" id="selectPhotoBtn">➕ Dodaj zdjęcie</button></div>
            <div class="info-box" style="margin-top:12px;">📸 Kliknij, wybierz JPG/PNG (max 5MB)</div>
        </div>
        <input type="file" id="photoInput" accept="image/jpeg,image/png,image/jpg" style="display:none;">
        <form id="mainForm">
            <div class="input-group"><label>Imię (imiona) *</label><input type="text" id="name" required placeholder="Jan Kowalski"></div>
            <div class="input-group"><label>Nazwisko *</label><input type="text" id="surname" required></div>
            <div class="input-group"><label>Płeć</label><select id="gender"><option>Mężczyzna</option><option>Kobieta</option></select></div>
            <div class="input-group"><label>Data urodzenia *</label><input type="date" id="dob" required></div>
            <div class="input-group"><label>Obywatelstwo *</label><input type="text" id="citizenship" required placeholder="polskie"></div>
            <div class="input-group"><label>Nazwisko rodowe</label><input type="text" id="maidenName"></div>
            <div class="input-group"><label>Nazwisko rodowe ojca</label><input type="text" id="fatherMaiden"></div>
            <div class="input-group"><label>Nazwisko rodowe matki</label><input type="text" id="motherMaiden"></div>
            <div class="input-group"><label>Miejsce zamieszkania</label><input type="text" id="residence"></div>
            <div class="input-group"><label>Miejsce urodzenia *</label><input type="text" id="birthPlace" required></div>
            <div class="input-group"><label>Kraj urodzenia *</label><input type="text" id="birthCountry" required></div>
            <div class="input-group"><label>Ulica i numer domu *</label><input type="text" id="street" required></div>
            <div class="row-2col"><div><label>Kod pocztowy *</label><input type="text" id="postalCode" required placeholder="00-000"></div><div><label>Miasto *</label><input type="text" id="city" required></div></div>
            <button type="submit">✅ WEJDŹ</button>
        </form>
        <div id="loadingMsg" class="loading-indicator">⏳ Ładowanie...</div>
        <div class="info-box">📱 iOS: Safari → udostępnij → Do ekranu głównego.<br>🤖 Android: Chrome → 3 kropki → Dodaj do ekranu głównego.</div>
    </div>
    <footer>Generator danych demonstracyjnych</footer>
</div>
<script>
    const photoInput=document.getElementById('photoInput'), selectBtn=document.getElementById('selectPhotoBtn'), zone=document.getElementById('photoZone'), previewDiv=document.getElementById('photoPreview');
    let currentImage=null;
    const trigger=()=>photoInput.click();
    selectBtn.addEventListener('click',trigger);
    zone.addEventListener('click',e=>{if(e.target!==selectBtn) trigger();});
    photoInput.addEventListener('change',function(e){
        const file=e.target.files[0];
        if(!file) return;
        if(file.size>5*1024*1024){alert('Maks. 5MB'); photoInput.value=''; return;}
        if(!file.type.startsWith('image/')){alert('Plik graficzny'); photoInput.value=''; return;}
        const reader=new FileReader();
        reader.onload=ev=>{currentImage=ev.target.result; previewDiv.innerHTML=''; let img=document.createElement('img'); img.src=currentImage; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; previewDiv.appendChild(img); document.getElementById('loadingMsg').style.display='none';};
        reader.onerror=()=>{alert('Błąd odczytu'); photoInput.value='';};
        reader.readAsDataURL(file);
    });
    document.getElementById('mainForm').addEventListener('submit',function(e){
        e.preventDefault();
        let hasError=false;
        ['name','surname','dob','citizenship','birthPlace','birthCountry','street','postalCode','city'].forEach(id=>{let f=document.getElementById(id); if(!f.value.trim()){f.style.borderColor='#c7362b'; hasError=true;}else f.style.borderColor='#cfdfed';});
        if(hasError){alert('Wypełnij wszystkie wymagane pola (*)'); return;}
        const loadSpan=document.getElementById('loadingMsg'); loadSpan.style.display='block';
        setTimeout(()=>{loadSpan.style.display='none'; alert(`📄 DANE ZAPISANE\nImię: ${document.getElementById('name').value}\nNazwisko: ${document.getElementById('surname').value}\nZdjęcie: ${currentImage?'✅ dodane':'⚠️ brak'}\n\nStrona działa poprawnie.`);},800);
    });
    window.addEventListener('load',()=>document.getElementById('loadingMsg').style.display='none');
</script>
</body>
</html>
